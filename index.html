<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Foto Report</title>

<style>

body{

font-family:Arial,sans-serif;

background:#f2f2f2;

margin:0;

padding:15px;

}

.container{

max-width:1200px;

margin:auto;

background:white;

padding:20px;

border-radius:10px;

box-shadow:0 0 10px rgba(0,0,0,.2);

}

h1,h2{

text-align:center;

margin:0;

}

.grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(180px,1fr));

gap:10px;

margin-top:20px;

}

input,select,button,textarea{

padding:12px;

border:1px solid black;

border-radius:5px;

font-size:14px;

}

button{

background:black;

color:white;

font-weight:bold;

cursor:pointer;

}

.folder{

border:2px solid black;

padding:10px;

margin-top:15px;

border-radius:10px;

}

.folder-title{

font-size:22px;

font-weight:bold;

margin-bottom:10px;

cursor:pointer;

}

.card{

border:1px solid #ccc;

border-radius:10px;

padding:10px;

margin-top:10px;

background:#f8f8f8;

}

.card img{

width:100%;

max-width:180px;

border-radius:8px;

margin-top:5px;

border:1px solid #ccc;

}

.top-buttons{

display:flex;

gap:10px;

flex-wrap:wrap;

margin-top:10px;

}

.red{

background:red;

}

.gray{

background:#444;

}

textarea{

width:100%;

height:120px;

}

</style>

</head>

<body>

<div class="container">

<h1>VELOCIMETROS CHARLY</h1>

<h2>FOTO REPORT</h2>

<div class="grid">

<select id="folderSelect"></select>

<input type="text" id="newFolder" placeholder="Nueva carpeta">

<button onclick="crearCarpeta()">CREAR CARPETA</button>

<input type="text" id="placas" placeholder="PLACAS">

<input type="number" id="kmAnterior" placeholder="KM ANTERIOR">

<input type="number" id="kmNuevo" placeholder="KM NUEVO">

<input type="text" id="vin" placeholder="VIN">

<input type="file" id="fotoAnterior" accept="image/*">

<input type="file" id="fotoNuevo" accept="image/*">

<input type="file" id="fotoVehiculo" accept="image/*">

<input type="file" id="fotoVin" accept="image/*">

</div>

<div class="top-buttons">

<textarea id="whatsappText" placeholder="PEGA AQUÍ EL TEXTO DE WHATSAPP"></textarea>

<button onclick="importarWhatsApp()">

IMPORTAR WHATSAPP

</button>

<button onclick="agregarRegistro()">

AGREGAR VEHÍCULO

</button>

</div>

<div id="folders"></div>

</div>

<script>

let data = JSON.parse(localStorage.getItem('fotoreport')) || {

folders:['AVEO','L200','HB20','F-150'],

records:[]

};

function saveData(){

localStorage.setItem('fotoreport',JSON.stringify(data));

}

function renderFolderSelect(){

let select = document.getElementById('folderSelect');

select.innerHTML='';

data.folders.forEach(f=>{

select.innerHTML += `<option value="${f}">${f}</option>`;

});

}

function crearCarpeta(){

let nombre = document.getElementById('newFolder').value.trim().toUpperCase();

if(!nombre){

alert('Escribe nombre');

return;

}

if(data.folders.includes(nombre)){

alert('Ya existe');

return;

}

data.folders.push(nombre);

saveData();

renderFolderSelect();

renderFolders();

document.getElementById('newFolder').value='';

}

function importarWhatsApp(){

let texto = document.getElementById('whatsappText').value;

let lineas = texto.split('\n');

let auto = '';

let placa = '';

let kmAnterior = '';

let kmNuevo = '';

let vin = '';

lineas.forEach(linea=>{

let l = linea.replace(/\*/g,'').trim();

if(l.includes('AUTO')){

auto = l.split(':')[1]?.trim() || '';

let autoUpper = auto.toUpperCase();

if(autoUpper !== '' && !data.folders.includes(autoUpper)){

data.folders.push(autoUpper);

saveData();

renderFolderSelect();

renderFolders();

}

}

if(l.includes('PLACA')){

placa = l.split(':')[1]?.trim() || '';

}

if(l.includes('KM anterior')){

kmAnterior = l.split(':')[1]?.trim() || '';

}

if(l.includes('CORECTO KM')){

kmNuevo = l.split(':')[1]?.trim() || '';

}

if(l.includes('VIN')){

vin = l.split(':')[1]?.trim() || '';

}

});

document.getElementById('folderSelect').value = auto.toUpperCase();

document.getElementById('placas').value = placa;

document.getElementById('kmAnterior').value = kmAnterior;

document.getElementById('kmNuevo').value = kmNuevo;

document.getElementById('vin').value = vin;

}

function agregarRegistro(){

let folder = document.getElementById('folderSelect').value;

let placas = document.getElementById('placas').value;

let kmAnterior = document.getElementById('kmAnterior').value;

let kmNuevo = document.getElementById('kmNuevo').value;

let vin = document.getElementById('vin').value;

let textoWhatsapp = document.getElementById('whatsappText').value;

let fotoAnterior = document.getElementById('fotoAnterior').files[0];

let fotoNuevo = document.getElementById('fotoNuevo').files[0];

let fotoVehiculo = document.getElementById('fotoVehiculo').files[0];

let fotoVin = document.getElementById('fotoVin').files[0];

if(!folder || !placas || !kmAnterior || !kmNuevo){

alert('Completa los datos');

return;

}

let existentes = data.records.filter(r=>r.folder===folder);

let numeroArchivo = Math.floor(existentes.length / 20) + 1;

let archivo = folder + '_RF' + numeroArchivo;

let fechaAuto = new Date().toLocaleDateString('es-MX');

data.records.push({

folder,

archivo,

placas,

kmAnterior,

kmNuevo,

vin,

textoWhatsapp,

fotoAnterior: fotoAnterior ? URL.createObjectURL(fotoAnterior) : '',

fotoNuevo: fotoNuevo ? URL.createObjectURL(fotoNuevo) : '',

fotoVehiculo: fotoVehiculo ? URL.createObjectURL(fotoVehiculo) : '',

fotoVin: fotoVin ? URL.createObjectURL(fotoVin) : '',

fecha:fechaAuto

});

saveData();

renderFolders();

document.getElementById('placas').value='';

document.getElementById('kmAnterior').value='';

document.getElementById('kmNuevo').value='';

document.getElementById('vin').value='';

document.getElementById('whatsappText').value='';

}

function borrarRegistro(index){

if(confirm('¿Borrar vehículo?')){

data.records.splice(index,1);

saveData();

renderFolders();

}

}

function borrarCarpeta(folder){

if(confirm('¿Borrar carpeta completa?')){

data.records = data.records.filter(r=>r.folder!==folder);

data.folders = data.folders.filter(f=>f!==folder);

saveData();

renderFolderSelect();

renderFolders();

}

}

function renderFolders(){

let div = document.getElementById('folders');

div.innerHTML='';

data.folders.forEach(folder=>{

let registros = data.records.filter(r=>r.folder===folder);

div.innerHTML += `

<div class="folder">

<div class="folder-title" onclick="toggleFolder('${folder}')">

📁 ${folder}

</div>

<button class="red" onclick="borrarCarpeta('${folder}')">

BORRAR CARPETA

</button>

<div id="content_${folder}" style="display:none;">

${registros.map((r,index)=>`

<div class="card">

<b>🚗 ${r.placas}</b><br><br>

KM ANTERIOR: ${r.kmAnterior}<br>

KM NUEVO: ${r.kmNuevo}<br>

VIN: ${r.vin}<br>

ARCHIVO: ${r.archivo}<br>

FECHA: ${r.fecha}<br><br>

<b>WHATSAPP:</b><br>

<pre>${r.textoWhatsapp}</pre>

<div class="top-buttons">

<div>

KM ANTERIOR<br>

<img src="${r.fotoAnterior}">

</div>

<div>

KM NUEVO<br>

<img src="${r.fotoNuevo}">

</div>

<div>

VEHÍCULO<br>

<img src="${r.fotoVehiculo}">

</div>

<div>

VIN<br>

<img src="${r.fotoVin}">

</div>

</div>

<div class="top-buttons">

<button class="gray">

PDF

</button>

<button class="red" onclick="borrarRegistro(${index})">

BORRAR

</button>

</div>

</div>

`).join('')}

</div>

</div>

`;

});

}

function toggleFolder(folder){

let div = document.getElementById('content_' + folder);

if(div.style.display === 'none'){

div.style.display='block';

}else{

div.style.display='none';

}

}

renderFolderSelect();

renderFolders();

</script>

</body>

</html>
