<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Foto Report</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f2f2f2;
margin:0;
padding:15px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:20px;
border-radius:35px;
box-shadow:0 0 20px rgba(0,0,0,0.2);
}

/* ========= LOGO ========= */

.logo{

text-align:center;

font-size:72px;

font-weight:900;

margin-bottom:35px;

letter-spacing:4px;

font-family:Arial Black,sans-serif;

color:#00f7ff;

-webkit-text-stroke:3px black;

text-shadow:
0 0 5px #00f7ff,
0 0 10px #00f7ff,
0 0 20px #00f7ff,
0 0 40px #00bfff,
4px 4px 0px black;

background:linear-gradient(
145deg,
#111,
#222,
#000
);

padding:15px;

border-radius:25px;

box-shadow:
0 0 20px #00e5ff,
0 0 40px #00e5ff;

}

/* ========= TEXTAREA ========= */

textarea{
width:100%;
padding:20px;
margin-top:10px;
border-radius:25px;
border:5px solid black;
font-size:22px;
box-sizing:border-box;
}

/* ========= FOTO ========= */

.photo-box{
border:5px dashed #ff4dff;
border-radius:30px;
padding:15px;
margin-top:20px;
text-align:center;
background:white;
}

.photo-box h2{
font-size:40px;
margin-bottom:15px;
}

.photo-box img{
width:100%;
max-height:350px;
object-fit:cover;
border-radius:20px;
margin-top:15px;
display:none;
}

/* ========= BOTONES ========= */

button{
width:100%;
padding:22px;
margin-top:20px;
border:none;
border-radius:28px;
font-size:28px;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

button:active{
transform:scale(0.97);
}

.import-btn{
background:black;
color:white;
}

.save-btn{

background:linear-gradient(
145deg,
#ff00ff,
#ff33cc
);

color:white;

box-shadow:
0 0 20px #ff00ff,
0 0 40px rgba(255,0,255,0.5);

font-size:32px;

font-weight:900;

letter-spacing:2px;

}

/* ========= CARPETAS ========= */

.folder{
border:4px solid black;
border-radius:30px;
padding:18px;
margin-top:25px;
background:white;
}

.folder-title{

font-size:55px;

font-weight:900;

margin-bottom:20px;

font-family:Arial Black,sans-serif;

color:#00f7ff;

-webkit-text-stroke:2px black;

text-shadow:
0 0 5px #00f7ff,
0 0 10px #00f7ff,
0 0 20px #00f7ff,
3px 3px 0px black;

transition:0.3s;

cursor:pointer;

}

.folder.closed .vehicle-card{
display:none;
}

.folder-buttons{
display:flex;
gap:15px;
}

.delete-folder{

flex:1;

background:linear-gradient(
145deg,
#00cfff,
#0066ff
);

color:white;

padding:18px;

border-radius:25px;

font-size:24px;

font-weight:bold;

box-shadow:
0 0 20px #00d9ff;

}

.pdf-btn{

width:170px;

background:linear-gradient(
145deg,
#444,
#222
);

color:white;

box-shadow:
0 0 10px rgba(0,0,0,0.5);

}

/* ========= VEHÍCULOS ========= */

.vehicle-card{

border:5px solid #00d9ff;

border-radius:30px;

padding:20px;

margin-top:18px;

background:white;

box-shadow:
0 0 15px #00e5ff,
0 0 30px rgba(0,255,255,0.3);

}

.edit-btn{

background:linear-gradient(
145deg,
#00e5ff,
#00bfff
);

color:white;

box-shadow:
0 0 15px #00e5ff;

}

.move-btn{

background:linear-gradient(
145deg,
#ff00ff,
#d100ff
);

color:white;

box-shadow:
0 0 15px #ff00ff;

}

.preview{
background:#f8f8f8;
padding:20px;
border-radius:25px;
border:4px solid black;
margin-top:15px;
font-size:22px;
white-space:pre-line;
}

</style>
</head>

<body>

<div class="container">

<h1 class="logo">
FOTO REPORT
</h1>

<textarea
id="textoWhatsapp"
rows="10"
placeholder="Pega texto WhatsApp aquí">
</textarea>

<button
class="import-btn"
onclick="importarWhatsapp()">
IMPORTAR WHATSAPP
</button>

<div class="photo-box">

<h2>KM ANTERIOR</h2>

<input
type="file"
accept="image/*"
onchange="cargarFoto(event,'foto1')">

<img
id="foto1"
onclick="window.currentPhotoTarget='foto1'">

</div>

<div class="photo-box">

<h2>KM NUEVO</h2>

<input
type="file"
accept="image/*"
onchange="cargarFoto(event,'foto2')">

<img
id="foto2"
onclick="window.currentPhotoTarget='foto2'">

</div>

<div class="photo-box">

<h2>VEHÍCULO / TARJETA</h2>

<input
type="file"
accept="image/*"
onchange="cargarFoto(event,'foto3')">

<img
id="foto3"
onclick="window.currentPhotoTarget='foto3'">

</div>

<div class="photo-box">

<h2>VIN</h2>

<input
type="file"
accept="image/*"
onchange="cargarFoto(event,'foto4')">

<img
id="foto4"
onclick="window.currentPhotoTarget='foto4'">

</div>

<div
class="preview"
id="previewTexto">
</div>

<button
class="save-btn"
onclick="guardarReporte()">
AGREGAR VEHÍCULO
</button>

<div id="folders"></div>

</div>

<script>

let carpetas =
JSON.parse(localStorage.getItem("carpetas")) || {};

let datosImportados = {};

/* ========= CARGAR FOTO ========= */

function cargarFoto(event,id){

const file = event.target.files[0];

if(!file) return;

const reader = new FileReader();

reader.onload = function(e){

const img = document.getElementById(id);

img.src = e.target.result;

img.style.display = "block";

};

reader.readAsDataURL(file);

}

/* ========= IMPORTAR WHATSAPP ========= */

function importarWhatsapp(){

let texto =
document.getElementById("textoWhatsapp").value;

function extraer(label){

let regex =
new RegExp("\\*" + label + "\\*:\\s*(.*)");

let match = texto.match(regex);

return match ? match[1].trim() : "";

}

datosImportados = {

vehiculo: extraer("AUTO"),
placa: extraer("PLACA"),
kmAnterior: extraer("KM anterior"),
kmNuevo: extraer("CORECTO KM"),
vin: extraer("VIN")

};

document.getElementById(
"previewTexto"
).innerText = texto;

}

/* ========= GUARDAR ========= */

function guardarReporte(){

let vehiculo =
datosImportados.vehiculo;

if(!vehiculo){

alert("Importa texto WhatsApp");

return;

}

if(!carpetas[vehiculo]){

carpetas[vehiculo] = [];

}

let reporte = {

vehiculo: datosImportados.vehiculo,
placa: datosImportados.placa,
kmAnterior: datosImportados.kmAnterior,
kmNuevo: datosImportados.kmNuevo,
vin: datosImportados.vin,

fecha:
new Date().toLocaleDateString(),

texto:
document.getElementById(
"textoWhatsapp"
).value,

foto1:
document.getElementById("foto1").src,

foto2:
document.getElementById("foto2").src,

foto3:
document.getElementById("foto3").src,

foto4:
document.getElementById("foto4").src

};

carpetas[vehiculo].push(reporte);

localStorage.setItem(
"carpetas",
JSON.stringify(carpetas)
);

renderFolders();

limpiarCampos();

}

/* ========= LIMPIAR ========= */

function limpiarCampos(){

document.getElementById(
"textoWhatsapp"
).value = "";

document.getElementById(
"previewTexto"
).innerText = "";

["foto1","foto2","foto3","foto4"]
.forEach(id=>{

document.getElementById(id).src = "";

document.getElementById(id).style.display =
"none";

});

datosImportados = {};

}

/* ========= BORRAR ========= */

function borrarCarpeta(nombre){

if(confirm("¿Borrar carpeta completa?")){

delete carpetas[nombre];

localStorage.setItem(
"carpetas",
JSON.stringify(carpetas)
);

renderFolders();

}

}

/* ========= EDITAR ========= */

function editarVehiculo(nombre,index){

alert(
"Próximamente edición completa"
);

}

/* ========= MOVER ========= */

function moverFotos(nombre,index){

alert(
"Próximamente mover imágenes"
);

}

/* ========= PDF ========= */

function generarPDF(nombre){

alert(
"PDF próximamente para " + nombre
);

}

/* ========= ABRIR / CERRAR ========= */

function toggleFolder(folder){

let div =
document.getElementById(
'content_' + folder
);

let parent =
document.getElementById(
'folder_' + folder
);

if(div.style.display === 'none'){

div.style.display = 'block';

parent.classList.remove('closed');

}else{

div.style.display = 'none';

parent.classList.add('closed');

}

}

/* ========= RENDER ========= */

function renderFolders(){

let div =
document.getElementById("folders");

div.innerHTML = "";

for(let nombre in carpetas){

div.innerHTML += `

<div class="folder closed"
id="folder_${nombre}">

<div class="folder-title"
onclick="toggleFolder('${nombre}')">

${nombre}

</div>

<div
id="content_${nombre}"
style="display:none;">

<div class="folder-buttons">

<button
class="delete-folder"
onclick="borrarCarpeta('${nombre}')">

BORRAR CARPETA

</button>

<button
class="pdf-btn"
onclick="generarPDF('${nombre}')">

PDF

</button>

</div>

`;

carpetas[nombre].forEach((r,index)=>{

div.innerHTML += `

<div class="vehicle-card">

<h3 style="
font-size:45px;
margin:0;
font-family:Arial Black;
">
${r.placa}
</h3>

<div style="
font-size:28px;
margin-top:10px;
">

KM:
→ ${r.kmNuevo}

</div>

<div style="
font-size:24px;
margin-top:8px;
">

VIN:
${r.vin}

</div>

<div style="
font-size:22px;
margin-top:8px;
">

📅 ${r.fecha}

</div>

<button
class="edit-btn"
onclick="editarVehiculo('${nombre}',${index})">

EDITAR

</button>

<button
class="move-btn"
onclick="moverFotos('${nombre}',${index})">

MOVER FOTOS

</button>

</div>

`;

});

div.innerHTML += `

</div>

</div>

`;

}

}

/* ========= PEGAR IMÁGENES ========= */

document.addEventListener(
"paste",
async function(e){

const items =
(e.clipboardData ||
e.originalEvent.clipboardData).items;

for(let item of items){

if(item.type.indexOf("image") === 0){

const blob =
item.getAsFile();

const reader =
new FileReader();

reader.onload =
function(event){

const base64 =
event.target.result;

if(!window.currentPhotoTarget){

alert(
"Toca primero la imagen donde pegarás la foto"
);

return;

}

const img =
document.getElementById(
window.currentPhotoTarget
);

img.src = base64;

img.style.display = "block";

};

reader.readAsDataURL(blob);

}

}

});

renderFolders();

</script>

</body>
</html>
