<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Foto Report</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f2f2f2;
margin:0;
padding:10px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:16px;
border-radius:30px;
box-shadow:0 0 15px rgba(0,0,0,0.15);
}

/* ========= LOGO ========= */

.logo{

text-align:center;

font-size:40px;

font-weight:900;

margin-bottom:20px;

letter-spacing:2px;

font-family:Arial Black,sans-serif;

color:#00f7ff;

-webkit-text-stroke:2px black;

text-shadow:
0 0 5px #00f7ff,
0 0 10px #00f7ff,
2px 2px 0px black;

background:linear-gradient(
145deg,
#111,
#000
);

padding:10px 25px;

border-radius:18px;

width:fit-content;

margin-left:auto;
margin-right:auto;

box-shadow:
0 0 15px #00e5ff;

}

/* ========= TEXTAREA ========= */

textarea{
width:100%;
padding:18px;
margin-top:10px;
border-radius:22px;
border:4px solid black;
font-size:18px;
box-sizing:border-box;
}

/* ========= BOTONES ========= */

button{
width:100%;
padding:18px;
margin-top:15px;
border:none;
border-radius:24px;
font-size:24px;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

button:active{
transform:scale(0.97);
}

.import-btn{
background:black;
color:white;
}

.save-btn{

background:linear-gradient(
145deg,
#ff00ff,
#ff33cc
);

color:white;

box-shadow:
0 0 18px #ff00ff;

font-size:24px;

font-weight:900;

letter-spacing:1px;

}

/* ========= FOTO BOX ========= */

.photo-box{

border:4px dashed #ff4dff;

border-radius:25px;

padding:14px;

margin-top:18px;

background:white;

text-align:center;

}

.photo-box h2{

font-size:26px;

margin-top:5px;

margin-bottom:18px;

font-family:Arial Black;

}

.photo-box input{

font-size:15px;

max-width:100%;

}

.photo-box img{

width:100%;

max-height:260px;

object-fit:cover;

border-radius:18px;

margin-top:12px;

display:none;

}

/* ========= PREVIEW ========= */

.preview{

background:#f8f8f8;

padding:16px;

border-radius:22px;

border:4px solid black;

margin-top:15px;

font-size:18px;

white-space:pre-line;

}

/* ========= CARPETAS ========= */

.folder{

border:4px solid black;

border-radius:28px;

padding:15px;

margin-top:22px;

background:white;

}

.folder-header{

display:flex;

justify-content:space-between;

align-items:center;

cursor:pointer;

}

.folder-title{

font-size:34px;

font-weight:900;

font-family:Arial Black,sans-serif;

color:#00f7ff;

-webkit-text-stroke:1.5px black;

text-shadow:
0 0 5px #00f7ff,
0 0 10px #00f7ff,
2px 2px 0px black;

}

.arrow{

font-size:34px;

font-weight:bold;

}

.folder-buttons{

display:flex;

gap:12px;

margin-top:15px;

}

.delete-folder{

flex:1;

background:linear-gradient(
145deg,
#00cfff,
#0066ff
);

color:white;

padding:14px;

border-radius:22px;

font-size:20px;

font-weight:bold;

box-shadow:
0 0 15px #00d9ff;

}

.pdf-btn{

width:150px;

background:linear-gradient(
145deg,
#444,
#222
);

color:white;

font-size:20px;

}

/* ========= VEHÍCULOS ========= */

.vehicle-card{

border:4px solid #00d9ff;

border-radius:28px;

padding:16px;

margin-top:18px;

background:white;

box-shadow:
0 0 12px #00e5ff;

}

.vehicle-card h3{

font-size:32px;

margin:0;

font-family:Arial Black;

}

.vehicle-card div{

font-size:19px;

margin-top:8px;

}

.edit-btn{

background:linear-gradient(
145deg,
#00e5ff,
#00bfff
);

color:white;

box-shadow:
0 0 12px #00e5ff;

font-size:20px;

}

.move-btn{

background:linear-gradient(
145deg,
#ff00ff,
#d100ff
);

color:white;

box-shadow:
0 0 12px #ff00ff;

font-size:20px;

}

</style>
</head>

<body>

<div class="container">

<h1 class="logo">
FOTO REPORT
</h1>

<textarea
id="textoWhatsapp"
rows="8"
placeholder="Pega texto WhatsApp aquí">
</textarea>

<button
class="import-btn"
onclick="importarWhatsapp()">
IMPORTAR WHATSAPP
</button>

<!-- ========= FOTO 1 ========= -->

<div class="photo-box">

<h2>KM ANTERIOR</h2>

<input
type="file"
accept="image/*"
onchange="cargarFoto(event,'foto1')">

<img
id="foto1"
onclick="window.currentPhotoTarget='foto1'">

</div>

<!-- ========= FOTO 2 ========= -->

<div class="photo-box">

<h2>KM NUEVO</h2>

<input
type="file"
accept="image/*"
onchange="cargarFoto(event,'foto2')">

<img
id="foto2"
onclick="window.currentPhotoTarget='foto2'">

</div>

<!-- ========= FOTO 3 ========= -->

<div class="photo-box">

<h2>VEHÍCULO / TARJETA</h2>

<input
type="file"
accept="image/*"
onchange="cargarFoto(event,'foto3')">

<img
id="foto3"
onclick="window.currentPhotoTarget='foto3'">

</div>

<!-- ========= FOTO 4 ========= -->

<div class="photo-box">

<h2>VIN</h2>

<input
type="file"
accept="image/*"
onchange="cargarFoto(event,'foto4')">

<img
id="foto4"
onclick="window.currentPhotoTarget='foto4'">

</div>

<div
class="preview"
id="previewTexto">
</div>

<button
class="save-btn"
onclick="guardarReporte()">
AGREGAR VEHÍCULO
</button>

<div id="folders"></div>

</div>

<script>

let carpetas =
JSON.parse(localStorage.getItem("carpetas")) || {};

let datosImportados = {};

/* ========= CARGAR FOTO ========= */

function cargarFoto(event,id){

const file = event.target.files[0];

if(!file) return;

const reader = new FileReader();

reader.onload = function(e){

const img =
document.getElementById(id);

img.src = e.target.result;

img.style.display = "block";

};

reader.readAsDataURL(file);

}

/* ========= IMPORTAR ========= */

function importarWhatsapp(){

let texto =
document.getElementById(
"textoWhatsapp"
).value;

function extraer(label){

let regex =
new RegExp("\\*" + label + "\\*:\\s*(.*)");

let match = texto.match(regex);

return match ? match[1].trim() : "";

}

datosImportados = {

vehiculo: extraer("AUTO"),
placa: extraer("PLACA"),
kmAnterior: extraer("KM anterior"),
kmNuevo: extraer("CORECTO KM"),
vin: extraer("VIN")

};

document.getElementById(
"previewTexto"
).innerText = texto;

}

/* ========= GUARDAR ========= */

function guardarReporte(){

let vehiculo =
datosImportados.vehiculo;

if(!vehiculo){

alert("Importa texto WhatsApp");

return;

}

if(!carpetas[vehiculo]){

carpetas[vehiculo] = [];

}

let reporte = {

vehiculo: datosImportados.vehiculo,

placa: datosImportados.placa,

kmAnterior:
datosImportados.kmAnterior,

kmNuevo:
datosImportados.kmNuevo,

vin:
datosImportados.vin,

fecha:
new Date().toLocaleDateString(),

texto:
document.getElementById(
"textoWhatsapp"
).value,

foto1:
document.getElementById(
"foto1"
).src,

foto2:
document.getElementById(
"foto2"
).src,

foto3:
document.getElementById(
"foto3"
).src,

foto4:
document.getElementById(
"foto4"
).src

};

carpetas[vehiculo].push(reporte);

localStorage.setItem(
"carpetas",
JSON.stringify(carpetas)
);

renderFolders();

limpiarCampos();

}

/* ========= LIMPIAR ========= */

function limpiarCampos(){

document.getElementById(
"textoWhatsapp"
).value = "";

document.getElementById(
"previewTexto"
).innerText = "";

["foto1","foto2","foto3","foto4"]
.forEach(id=>{

document.getElementById(id).src = "";

document.getElementById(id).style.display =
"none";

});

datosImportados = {};

}

/* ========= BORRAR ========= */

function borrarCarpeta(nombre){

if(confirm("¿Borrar carpeta completa?")){

delete carpetas[nombre];

localStorage.setItem(
"carpetas",
JSON.stringify(carpetas)
);

renderFolders();

}

}

/* ========= PDF ========= */

function generarPDF(nombre){

alert(
"PDF próximamente para " + nombre
);

}

/* ========= EDITAR ========= */

function editarVehiculo(nombre,index){

alert(
"Próximamente edición completa"
);

}

/* ========= MOVER ========= */

function moverFotos(nombre,index){

alert(
"Próximamente mover imágenes"
);

}

/* ========= TOGGLE ========= */

function toggleFolder(folder){

let div =
document.getElementById(
'content_' + folder
);

if(div.style.display === 'none'){

div.style.display = 'block';

}else{

div.style.display = 'none';

}

}

/* ========= RENDER ========= */

function renderFolders(){

let div =
document.getElementById(
"folders"
);

div.innerHTML = "";

for(let nombre in carpetas){

div.innerHTML += `

<div class="folder">

<div
class="folder-header"
onclick="toggleFolder('${nombre}')">

<div class="folder-title">

${nombre}

</div>

<div class="arrow">
⌄
</div>

</div>

<div
id="content_${nombre}"
style="display:none;">

<div class="folder-buttons">

<button
class="delete-folder"
onclick="borrarCarpeta('${nombre}')">

BORRAR CARPETA

</button>

<button
class="pdf-btn"
onclick="generarPDF('${nombre}')">

PDF

</button>

</div>

`;

carpetas[nombre].forEach((r,index)=>{

div.innerHTML += `

<div class="vehicle-card">

<h3>
🚗 ${r.placa}
</h3>

<div>
KM: → ${r.kmNuevo}
</div>

<div>
VIN: ${r.vin}
</div>

<div>
📅 ${r.fecha}
</div>

<button
class="edit-btn"
onclick="editarVehiculo('${nombre}',${index})">

EDITAR

</button>

<button
class="move-btn"
onclick="moverFotos('${nombre}',${index})">

MOVER FOTOS

</button>

</div>

`;

});

div.innerHTML += `

</div>

</div>

`;

}

}

/* ========= PEGAR IMAGEN ========= */

document.addEventListener(
"paste",
async function(e){

const items =
(e.clipboardData ||
e.originalEvent.clipboardData).items;

for(let item of items){

if(item.type.indexOf("image") === 0){

const blob =
item.getAsFile();

const reader =
new FileReader();

reader.onload =
function(event){

const base64 =
event.target.result;

if(!window.currentPhotoTarget){

alert(
"Toca primero la imagen donde pegarás la foto"
);

return;

}

const img =
document.getElementById(
window.currentPhotoTarget
);

img.src = base64;

img.style.display = "block";

};

reader.readAsDataURL(blob);

}

}

});

renderFolders();

</script>

</body>
</html>
