<script>

let carpetas =
JSON.parse(localStorage.getItem("carpetas")) || {};

let datosImportados = {};

let editando = false;
let editFolder = "";
let editIndex = null;

/* ========= CARGAR FOTO COMPRIMIDA ========= */

function cargarFoto(event,id){

const file = event.target.files[0];

if(!file) return;

const reader = new FileReader();

reader.onload = function(e){

const img = new Image();

img.onload = function(){

const canvas =
document.createElement("canvas");

const ctx =
canvas.getContext("2d");

let maxWidth = 800;

let scale =
maxWidth / img.width;

canvas.width = maxWidth;

canvas.height =
img.height * scale;

ctx.drawImage(
img,
0,
0,
canvas.width,
canvas.height
);

const compressed =
canvas.toDataURL(
'image/jpeg',
0.5
);

const preview =
document.getElementById(id);

preview.src = compressed;

preview.style.display = "block";

};

img.src = e.target.result;

};

reader.readAsDataURL(file);

}

/* ========= IMPORTAR ========= */

function importarWhatsapp(){

let texto =
document.getElementById(
"textoWhatsapp"
).value;

function extraer(label){

let regex =
new RegExp("\\*" + label + "\\*:\\s*(.*)");

let match = texto.match(regex);

return match ? match[1].trim() : "";

}

datosImportados = {

vehiculo: extraer("AUTO"),
placa: extraer("PLACA"),
kmAnterior: extraer("KM anterior"),
kmNuevo: extraer("CORECTO KM"),
vin: extraer("VIN")

};

document.getElementById(
"previewTexto"
).innerText = texto;

}

/* ========= GUARDAR ========= */

function guardarReporte(){

let vehiculo =
datosImportados.vehiculo;

if(!vehiculo){

alert("Importa texto WhatsApp");

return;

}

if(!carpetas[vehiculo]){

carpetas[vehiculo] = [];

}

let reporte = {

vehiculo: datosImportados.vehiculo,

placa: datosImportados.placa,

kmAnterior:
datosImportados.kmAnterior,

kmNuevo:
datosImportados.kmNuevo,

vin:
datosImportados.vin,

fecha:
new Date().toLocaleDateString(),

texto:
document.getElementById(
"textoWhatsapp"
).value,

foto1:
document.getElementById(
"foto1"
).src,

foto2:
document.getElementById(
"foto2"
).src,

foto3:
document.getElementById(
"foto3"
).src,

foto4:
document.getElementById(
"foto4"
).src

};

if(editando){

carpetas[editFolder][editIndex] = reporte;

editando = false;
editFolder = "";
editIndex = null;

document.getElementById(
"saveBtn"
).innerText =
"AGREGAR VEHÍCULO";

alert("Vehículo actualizado");

}else{

carpetas[vehiculo].push(reporte);

}

/* ========= GUARDADO SEGURO ========= */

try{

localStorage.setItem(
"carpetas",
JSON.stringify(carpetas)
);

}catch(e){

alert(
"Memoria llena. Usa fotos más ligeras."
);

return;

}

renderFolders();

limpiarCampos();

alert("Vehículo agregado");

}

/* ========= LIMPIAR ========= */

function limpiarCampos(){

document.getElementById(
"textoWhatsapp"
).value = "";

document.getElementById(
"previewTexto"
).innerText = "";

["foto1","foto2","foto3","foto4"]
.forEach(id=>{

document.getElementById(id).src = "";

document.getElementById(id).style.display =
"none";

});

datosImportados = {};

}

/* ========= BORRAR CARPETA ========= */

function borrarCarpeta(nombre){

if(confirm("¿Borrar carpeta completa?")){

delete carpetas[nombre];

localStorage.setItem(
"carpetas",
JSON.stringify(carpetas)
);

volverInicio();

renderFolders();

}

}

/* ========= BORRAR VEHÍCULO ========= */

function borrarVehiculo(nombre,index){

if(confirm("¿Borrar vehículo?")){

carpetas[nombre].splice(index,1);

if(carpetas[nombre].length === 0){

delete carpetas[nombre];

volverInicio();

}else{

renderFolderPage(nombre);

}

localStorage.setItem(
"carpetas",
JSON.stringify(carpetas)
);

renderFolders();

}

}

/* ========= PDF ========= */

function generarPDF(nombre){

alert(
"PDF próximamente para " + nombre
);

}

/* ========= EDITAR ========= */

function editarVehiculo(nombre,index){

let r = carpetas[nombre][index];

datosImportados = {

vehiculo:r.vehiculo,
placa:r.placa,
kmAnterior:r.kmAnterior,
kmNuevo:r.kmNuevo,
vin:r.vin

};

document.getElementById(
"textoWhatsapp"
).value = r.texto;

document.getElementById(
"previewTexto"
).innerText = r.texto;

["foto1","foto2","foto3","foto4"]
.forEach(id=>{

let img =
document.getElementById(id);

if(r[id]){

img.src = r[id];

img.style.display = "block";

}

});

editando = true;

editFolder = nombre;

editIndex = index;

document.getElementById(
"saveBtn"
).innerText =
"GUARDAR CAMBIOS";

volverInicio();

window.scrollTo({
top:0,
behavior:"smooth"
});

}

/* ========= MOVER ========= */

function moverFotos(nombre,index){

let r = carpetas[nombre][index];

let opcion = prompt(
"¿Qué foto mover?\\n1 = KM anterior\\n2 = KM nuevo\\n3 = Vehículo\\n4 = VIN"
);

let destino = prompt(
"¿A qué cuadro mover?\\n1 = KM anterior\\n2 = KM nuevo\\n3 = Vehículo\\n4 = VIN"
);

if(!opcion || !destino) return;

let origenKey = "foto" + opcion;

let destinoKey = "foto" + destino;

let temp = r[origenKey];

r[origenKey] = r[destinoKey];

r[destinoKey] = temp;

localStorage.setItem(
"carpetas",
JSON.stringify(carpetas)
);

renderFolderPage(nombre);

alert("Fotos movidas");

}

/* ========= TOGGLE ========= */

function toggleVehicle(id){

let div =
document.getElementById(
'vehicle_' + id
);

if(div.style.display === 'none'){

div.style.display = 'block';

}else{

div.style.display = 'none';

}

}

/* ========= ABRIR CARPETA ========= */

function abrirCarpeta(nombre){

document.getElementById("mainPage")
.style.display = "none";

document.getElementById("folderPage")
.style.display = "block";

document.getElementById("folderPageTitle")
.innerHTML = "📁 " + nombre;

renderFolderPage(nombre);

window.currentFolder = nombre;

}

/* ========= VOLVER ========= */

function volverInicio(){

document.getElementById("mainPage")
.style.display = "block";

document.getElementById("folderPage")
.style.display = "none";

}

/* ========= RENDER PRINCIPAL ========= */

function renderFolders(){

let div =
document.getElementById(
"folders"
);

div.innerHTML = "";

for(let nombre in carpetas){

div.innerHTML += `

<div class="folder">

<div
class="folder-header"
onclick="abrirCarpeta('${nombre}')">

<div class="folder-title">

📁 ${nombre}

</div>

<div class="arrow">
⌄
</div>

</div>

</div>

`;

}

}

/* ========= PAGINA CARPETA ========= */

function renderFolderPage(nombre){

let div =
document.getElementById(
"folderPageContent"
);

div.innerHTML = `

<div class="folder-buttons">

<button
class="delete-folder"
onclick="borrarCarpeta('${nombre}')">

BORRAR CARPETA

</button>

<button
class="pdf-btn"
onclick="generarPDF('${nombre}')">

PDF

</button>

</div>

`;

carpetas[nombre].forEach((r,index)=>{

div.innerHTML += `

<div class="vehicle-card">

<div
class="vehicle-header"
onclick="toggleVehicle('${nombre}_${index}')">

<h3>
🚗 ${r.placa}
</h3>

<div class="arrow">
⌄
</div>

</div>

<div
id="vehicle_${nombre}_${index}"
style="display:block;">

<div>
KM: → ${r.kmNuevo}
</div>

<div>
VIN: ${r.vin}
</div>

<div>
📅 ${r.fecha}
</div>

<div class="vehicle-buttons">

<button
class="edit-btn"
onclick="event.stopPropagation();editarVehiculo('${nombre}',${index})">

EDITAR

</button>

<button
class="move-btn"
onclick="event.stopPropagation();moverFotos('${nombre}',${index})">

MOVER FOTOS

</button>

<button
class="delete-vehicle"
onclick="event.stopPropagation();borrarVehiculo('${nombre}',${index})">

BORRAR

</button>

</div>

</div>

</div>

`;

});

}

/* ========= PEGAR IMAGEN ========= */

document.addEventListener(
"paste",
async function(e){

const items =
(e.clipboardData ||
e.originalEvent.clipboardData).items;

for(let item of items){

if(item.type.indexOf("image") === 0){

const blob =
item.getAsFile();

const reader =
new FileReader();

reader.onload =
function(event){

const img = new Image();

img.onload = function(){

const canvas =
document.createElement("canvas");

const ctx =
canvas.getContext("2d");

let maxWidth = 800;

let scale =
maxWidth / img.width;

canvas.width = maxWidth;

canvas.height =
img.height * scale;

ctx.drawImage(
img,
0,
0,
canvas.width,
canvas.height
);

const compressed =
canvas.toDataURL(
'image/jpeg',
0.5
);

if(!window.currentPhotoTarget){

alert(
"Toca primero la imagen donde pegarás la foto"
);

return;

}

const preview =
document.getElementById(
window.currentPhotoTarget
);

preview.src = compressed;

preview.style.display = "block";

};

img.src = event.target.result;

};

reader.readAsDataURL(blob);

}

}

});

renderFolders();

</script>
