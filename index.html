<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FOTO REPORT</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f2f2f2;
margin:0;
padding:15px;
}

.container{
max-width:1200px;
margin:auto;
background:white;
padding:20px;
border-radius:25px;
box-shadow:0 0 20px rgba(0,0,0,0.15);
}

h1{
text-align:center;
font-size:45px;
margin-bottom:25px;
}

.top-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-bottom:15px;
}

input,
select,
textarea{
width:100%;
padding:18px;
border-radius:18px;
border:4px solid black;
font-size:18px;
box-sizing:border-box;
}

textarea{
height:220px;
resize:none;
}

button{
width:100%;
padding:18px;
border:none;
border-radius:18px;
font-size:20px;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

button:hover{
transform:scale(1.02);
}

.black-btn{
background:black;
color:white;
margin-top:10px;
}

.save-btn{
background:#ff00ff;
color:white;
margin-top:10px;
box-shadow:0 0 25px #ff00ff;
}

.folder{
border:4px solid black;
border-radius:22px;
padding:15px;
margin-top:20px;
background:white;
}

.folder-header{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:10px;
}

.folder-title{
font-size:45px;
font-weight:bold;
}

.folder-buttons{
display:flex;
gap:10px;
}

.delete-folder-btn{
background:red;
color:white;
width:auto;
padding:15px 20px;
}

.pdf-folder-btn{
background:#444;
color:white;
width:auto;
padding:15px 20px;
}

.record{
border:3px solid #ccc;
border-radius:20px;
padding:15px;
margin-top:15px;
}

.photo-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:15px;
}

.photo-box{
border:3px dashed #ff00ff;
border-radius:18px;
padding:10px;
text-align:center;
background:#fff;
min-height:220px;
position:relative;
overflow:hidden;
}

.photo-box.dragover{
background:#ffe6ff;
}

.photo-box img{
width:100%;
height:200px;
object-fit:cover;
border-radius:15px;
margin-top:10px;
}

.photo-title{
font-weight:bold;
font-size:18px;
margin-bottom:10px;
}

.file-input{
margin-top:10px;
}

.move-buttons{
display:flex;
gap:5px;
margin-top:10px;
}

.move-buttons button{
padding:8px;
font-size:14px;
background:#ff00ff;
color:white;
}

.info{
font-size:18px;
line-height:1.6;
margin-top:10px;
}

@media(max-width:700px){

.top-grid{
grid-template-columns:1fr;
}

.photo-grid{
grid-template-columns:1fr;
}

.folder-title{
font-size:28px;
}

}

</style>
</head>

<body>

<div class="container">

<h1>FOTO REPORT</h1>

<div class="top-grid">

<select id="folderSelect"></select>

<input type="text"
id="newFolder"
placeholder="Nueva carpeta">

</div>

<button class="black-btn"
onclick="createFolder()">
CREAR CARPETA
</button>

<div class="top-grid" style="margin-top:15px;">

<div class="photo-box"
ondrop="dropImage(event,'img1')"
ondragover="allowDrop(event)"
ondragleave="removeDrag(event)">

<div class="photo-title">
KM ANTERIOR
</div>

<input type="file"
accept="image/*"
class="file-input"
onchange="loadImage(event,'img1')">

<img id="img1Preview">

</div>

<div class="photo-box"
ondrop="dropImage(event,'img2')"
ondragover="allowDrop(event)"
ondragleave="removeDrag(event)">

<div class="photo-title">
KM NUEVO
</div>

<input type="file"
accept="image/*"
class="file-input"
onchange="loadImage(event,'img2')">

<img id="img2Preview">

</div>

<div class="photo-box"
ondrop="dropImage(event,'img3')"
ondragover="allowDrop(event)"
ondragleave="removeDrag(event)">

<div class="photo-title">
VEHÍCULO / TARJETA
</div>

<input type="file"
accept="image/*"
class="file-input"
onchange="loadImage(event,'img3')">

<img id="img3Preview">

</div>

<div class="photo-box"
ondrop="dropImage(event,'img4')"
ondragover="allowDrop(event)"
ondragleave="removeDrag(event)">

<div class="photo-title">
VIN
</div>

<input type="file"
accept="image/*"
class="file-input"
onchange="loadImage(event,'img4')">

<img id="img4Preview">

</div>

</div>

<textarea
id="whatsappText"
placeholder="PEGA AQUÍ EL TEXTO DE WHATSAPP"></textarea>

<button class="black-btn"
onclick="importWhatsApp()">
IMPORTAR WHATSAPP
</button>

<button class="save-btn"
onclick="saveRecord()">
GUARDAR REPORTE
</button>

<div id="folders"></div>

</div>

<script>

let data = JSON.parse(localStorage.getItem('photoReportData')) || {
folders:[],
records:[]
};

let images = {
img1:"",
img2:"",
img3:"",
img4:""
};

function saveData(){
localStorage.setItem(
'photoReportData',
JSON.stringify(data)
);
}

function createFolder(){

let folder =
document.getElementById('newFolder').value.trim();

if(folder === "") return;

if(!data.folders.includes(folder)){
data.folders.push(folder);
saveData();
renderFolderSelect();
renderFolders();
}

document.getElementById('newFolder').value = "";

}

function renderFolderSelect(){

let select =
document.getElementById('folderSelect');

select.innerHTML = "";

data.folders.forEach(folder=>{

select.innerHTML += `
<option value="${folder}">
${folder}
</option>
`;

});

}

function loadImage(event,key){

let file = event.target.files[0];

if(!file) return;

let reader = new FileReader();

reader.onload = function(e){

images[key] = e.target.result;

document.getElementById(
key + 'Preview'
).src = e.target.result;

};

reader.readAsDataURL(file);

}

function allowDrop(event){
event.preventDefault();
event.currentTarget.classList.add('dragover');
}

function removeDrag(event){
event.currentTarget.classList.remove('dragover');
}

function dropImage(event,key){

event.preventDefault();

event.currentTarget.classList.remove('dragover');

let file = event.dataTransfer.files[0];

if(!file) return;

let reader = new FileReader();

reader.onload = function(e){

images[key] = e.target.result;

document.getElementById(
key + 'Preview'
).src = e.target.result;

};

reader.readAsDataURL(file);

}

async function saveRecord(){

let folder =
document.getElementById('folderSelect').value;

if(folder === ""){
alert("CREA UNA CARPETA");
return;
}

let text =
document.getElementById('whatsappText').value;

let record = {
folder,
text,
date:new Date().toLocaleString(),
photos:[
images.img1,
images.img2,
images.img3,
images.img4
]
};

data.records.push(record);

saveData();

renderFolders();

alert("REPORTE GUARDADO");

document.getElementById('whatsappText').value = "";

}

function renderFolders(){

let div =
document.getElementById('folders');

div.innerHTML = "";

data.folders.forEach(folder=>{

let registros =
data.records.filter(
r=>r.folder===folder
);

div.innerHTML += `

<div class="folder">

<div class="folder-header">

<div class="folder-title">
📂 ${folder}
</div>

<div class="folder-buttons">

<button class="delete-folder-btn"
onclick="deleteFolder('${folder}')">
BORRAR CARPETA
</button>

<button class="pdf-folder-btn"
onclick="generateFolderPDF('${folder}')">
PDF
</button>

</div>

</div>

${registros.map((r,index)=>`

<div class="record">

<div class="info">

<b>FECHA:</b> ${r.date}
<br><br>

${r.text.replace(/\n/g,'<br>')}

</div>

<div class="photo-grid">

${r.photos.map((p,i)=>`

<div class="photo-box">

<img src="${p}">

<div class="move-buttons">

<button onclick="
movePhoto('${folder}',
${index},
${i},
-1)">
⬅
</button>

<button onclick="
movePhoto('${folder}',
${index},
${i},
1)">
➡
</button>

</div>

</div>

`).join('')}

</div>

</div>

`).join('')}

</div>

`;

});

}

function movePhoto(folder,recordIndex,photoIndex,direction){

let record =
data.records.filter(
r=>r.folder===folder
)[recordIndex];

let newIndex =
photoIndex + direction;

if(newIndex < 0 || newIndex > 3) return;

let temp =
record.photos[photoIndex];

record.photos[photoIndex] =
record.photos[newIndex];

record.photos[newIndex] = temp;

saveData();

renderFolders();

}

function deleteFolder(folder){

if(!confirm("BORRAR CARPETA?")) return;

data.records =
data.records.filter(
r=>r.folder!==folder
);

data.folders =
data.folders.filter(
f=>f!==folder
);

saveData();

renderFolderSelect();

renderFolders();

}

function importWhatsApp(){

let text =
document.getElementById('whatsappText').value;

alert("TEXTO IMPORTADO");

}

function generateFolderPDF(folder){

window.print();

}

renderFolderSelect();

renderFolders();

</script>

</body>
</html>
