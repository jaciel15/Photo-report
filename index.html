<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Foto Report</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f2f2f2;
margin:0;
padding:15px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:20px;
border-radius:35px;
box-shadow:0 0 20px rgba(0,0,0,0.2);
}

.logo{
text-align:center;
font-size:65px;
font-weight:900;
margin-bottom:30px;
letter-spacing:4px;
color:#00ffe5;
text-shadow:
0 0 5px #00ffe5,
0 0 10px #00ffe5,
0 0 20px #00ffe5,
0 0 40px #00bfff;
font-family:Arial Black,sans-serif;
}

textarea{
width:100%;
padding:20px;
margin-top:10px;
border-radius:25px;
border:5px solid black;
font-size:22px;
box-sizing:border-box;
}

.photo-box{
border:5px dashed #ff4dff;
border-radius:30px;
padding:15px;
margin-top:20px;
text-align:center;
background:white;
}

.photo-box h2{
font-size:40px;
margin-bottom:15px;
}

.photo-box img{
width:100%;
max-height:350px;
object-fit:cover;
border-radius:20px;
margin-top:15px;
display:none;
}

button{
width:100%;
padding:22px;
margin-top:20px;
border:none;
border-radius:28px;
font-size:28px;
font-weight:bold;
cursor:pointer;
}

.import-btn{
background:black;
color:white;
}

.save-btn{
background:linear-gradient(145deg,#ff00ff,#ff33cc);
color:white;
box-shadow:0 0 30px #ff66ff;
}

.folder{
border:4px solid black;
border-radius:30px;
padding:18px;
margin-top:25px;
background:white;
}

.folder-title{
font-size:35px;
font-weight:bold;
margin-bottom:15px;
}

.folder-buttons{
display:flex;
gap:15px;
}

.delete-folder{
flex:1;
background:linear-gradient(145deg,#00cfff,#0066ff);
color:white;
border:none;
padding:18px;
border-radius:25px;
font-size:24px;
font-weight:bold;
box-shadow:0 0 20px #00d9ff;
}

.pdf-btn{
width:170px;
background:#555;
color:white;
}

.preview{
background:#f8f8f8;
padding:20px;
border-radius:25px;
border:4px solid black;
margin-top:15px;
font-size:22px;
white-space:pre-line;
}

.vehicle-card{
border:4px solid #00d9ff;
border-radius:25px;
padding:15px;
margin-top:15px;
background:#fdfdfd;
box-shadow:0 0 15px #00e5ff;
}

.vehicle-card h3{
font-size:28px;
margin:0 0 10px 0;
}

.vehicle-card button{
font-size:20px;
padding:15px;
margin-top:10px;
}

.edit-btn{
background:#00cfff;
color:white;
}

.move-btn{
background:#ff00ff;
color:white;
}

</style>
</head>

<body>

<div class="container">

<h1 class="logo">
📸 FOTO REPORT
</h1>

<textarea
id="textoWhatsapp"
rows="10"
placeholder="Pega texto WhatsApp aquí">
</textarea>

<button
class="import-btn"
onclick="importarWhatsapp()">
IMPORTAR WHATSAPP
</button>

<div class="photo-box">

<h2>KM ANTERIOR</h2>

<input
type="file"
accept="image/*"
onchange="cargarFoto(event,'foto1')">

<img
id="foto1"
onclick="window.currentPhotoTarget='foto1'">

</div>

<div class="photo-box">

<h2>KM NUEVO</h2>

<input
type="file"
accept="image/*"
onchange="cargarFoto(event,'foto2')">

<img
id="foto2"
onclick="window.currentPhotoTarget='foto2'">

</div>

<div class="photo-box">

<h2>VEHÍCULO / TARJETA</h2>

<input
type="file"
accept="image/*"
onchange="cargarFoto(event,'foto3')">

<img
id="foto3"
onclick="window.currentPhotoTarget='foto3'">

</div>

<div class="photo-box">

<h2>VIN</h2>

<input
type="file"
accept="image/*"
onchange="cargarFoto(event,'foto4')">

<img
id="foto4"
onclick="window.currentPhotoTarget='foto4'">

</div>

<div
class="preview"
id="previewTexto">
</div>

<button
class="save-btn"
onclick="guardarReporte()">
AGREGAR VEHÍCULO
</button>

<div id="folders"></div>

</div>

<script>

let carpetas =
JSON.parse(localStorage.getItem("carpetas")) || {};

let datosImportados = {};

function cargarFoto(event,id){

const file = event.target.files[0];

if(!file) return;

const reader = new FileReader();

reader.onload = function(e){

const img = document.getElementById(id);

img.src = e.target.result;

img.style.display = "block";

};

reader.readAsDataURL(file);

}

function importarWhatsapp(){

let texto =
document.getElementById("textoWhatsapp").value;

function extraer(label){

let regex =
new RegExp("\\*" + label + "\\*:\\s*(.*)");

let match = texto.match(regex);

return match ? match[1].trim() : "";

}

datosImportados = {

vehiculo: extraer("AUTO"),
placa: extraer("PLACA"),
kmAnterior: extraer("KM anterior"),
kmNuevo: extraer("CORECTO KM"),
vin: extraer("VIN")

};

document.getElementById(
"previewTexto"
).innerText = texto;

}

function guardarReporte(){

let vehiculo =
datosImportados.vehiculo;

if(!vehiculo){

alert("Importa texto WhatsApp");

return;

}

if(!carpetas[vehiculo]){

carpetas[vehiculo] = [];

}

let reporte = {

vehiculo: datosImportados.vehiculo,
placa: datosImportados.placa,
kmAnterior: datosImportados.kmAnterior,
kmNuevo: datosImportados.kmNuevo,
vin: datosImportados.vin,

fecha:
new Date().toLocaleDateString(),

texto:
document.getElementById(
"textoWhatsapp"
).value,

foto1:
document.getElementById("foto1").src,

foto2:
document.getElementById("foto2").src,

foto3:
document.getElementById("foto3").src,

foto4:
document.getElementById("foto4").src

};

carpetas[vehiculo].push(reporte);

localStorage.setItem(
"carpetas",
JSON.stringify(carpetas)
);

renderFolders();

limpiarCampos();

}

function limpiarCampos(){

document.getElementById(
"textoWhatsapp"
).value = "";

document.getElementById(
"previewTexto"
).innerText = "";

["foto1","foto2","foto3","foto4"]
.forEach(id=>{

document.getElementById(id).src = "";

document.getElementById(id).style.display =
"none";

});

datosImportados = {};

}

function borrarCarpeta(nombre){

if(confirm("¿Borrar carpeta completa?")){

delete carpetas[nombre];

localStorage.setItem(
"carpetas",
JSON.stringify(carpetas)
);

renderFolders();

}

}

function editarVehiculo(nombre,index){

alert(
"Próximamente edición completa de " +
nombre
);

}

function moverFotos(nombre,index){

alert(
"Próximamente mover imágenes"
);

}

function generarPDF(nombre){

alert(
"PDF próximamente para " + nombre
);

}

function renderFolders(){

let div =
document.getElementById("folders");

div.innerHTML = "";

for(let nombre in carpetas){

div.innerHTML += `

<div class="folder">

<div class="folder-title">
📁 ${nombre}
</div>

<div class="folder-buttons">

<button
class="delete-folder"
onclick="borrarCarpeta('${nombre}')">
BORRAR CARPETA
</button>

<button
class="pdf-btn"
onclick="generarPDF('${nombre}')">
PDF
</button>

</div>

`;

carpetas[nombre].forEach((r,index)=>{

div.innerHTML += `

<div class="vehicle-card">

<h3>
🚗 ${r.placa}
</h3>

<div>
KM:
${r.kmAnterior}
→
${r.kmNuevo}
</div>

<div>
VIN:
${r.vin}
</div>

<div>
📅 ${r.fecha}
</div>

<button
class="edit-btn"
onclick="editarVehiculo('${nombre}',${index})">
EDITAR
</button>

<button
class="move-btn"
onclick="moverFotos('${nombre}',${index})">
MOVER FOTOS
</button>

</div>

`;

});

div.innerHTML += `</div>`;

}

}

document.addEventListener(
"paste",
async function(e){

const items =
(e.clipboardData ||
e.originalEvent.clipboardData).items;

for(let item of items){

if(item.type.indexOf("image") === 0){

const blob =
item.getAsFile();

const reader =
new FileReader();

reader.onload =
function(event){

const base64 =
event.target.result;

if(!window.currentPhotoTarget){

alert(
"Toca primero la imagen donde pegarás la foto"
);

return;

}

const img =
document.getElementById(
window.currentPhotoTarget
);

img.src = base64;

img.style.display = "block";

};

reader.readAsDataURL(blob);

}

}

});

renderFolders();

</script>

</body>
</html>
