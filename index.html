<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Foto Report</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f2f2f2;
margin:0;
padding:15px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:20px;
border-radius:30px;
box-shadow:0 0 20px rgba(0,0,0,0.2);
}

h1{
text-align:center;
font-size:40px;
margin-bottom:20px;
}

input,textarea{
width:100%;
padding:15px;
margin-top:10px;
border-radius:18px;
border:3px solid black;
font-size:18px;
box-sizing:border-box;
}

.photo-box{
border:4px dashed #ff4dff;
border-radius:25px;
padding:15px;
margin-top:15px;
text-align:center;
background:white;
}

.photo-box img{
width:100%;
max-height:350px;
object-fit:cover;
border-radius:20px;
margin-top:10px;
display:none;
}

button{
width:100%;
padding:20px;
margin-top:15px;
border:none;
border-radius:25px;
font-size:22px;
font-weight:bold;
cursor:pointer;
}

.import-btn{
background:black;
color:white;
}

.save-btn{
background:linear-gradient(145deg,#ff00ff,#ff33cc);
color:white;
box-shadow:0 0 25px #ff66ff;
}

.folder{
border:3px solid black;
border-radius:25px;
padding:15px;
margin-top:20px;
background:white;
}

.folder-title{
font-size:28px;
font-weight:bold;
margin-bottom:15px;
}

.folder-buttons{
display:flex;
gap:15px;
}

.delete-folder{
flex:1;
background:linear-gradient(145deg,#00cfff,#0066ff);
color:white;
border:none;
padding:15px;
border-radius:20px;
font-size:20px;
font-weight:bold;
box-shadow:0 0 20px #00d9ff;
}

.pdf-btn{
width:150px;
background:#555;
color:white;
}

.preview{
background:#f8f8f8;
padding:15px;
border-radius:25px;
border:3px solid black;
margin-top:15px;
font-size:20px;
white-space:pre-line;
}

</style>
</head>
<body>

<div class="container">

<h1>📸 Foto Report</h1>

<input type="text" id="vehiculo" placeholder="Vehículo">

<input type="text" id="placa" placeholder="Placa">

<input type="number" id="kmAnterior" placeholder="KM anterior">

<input type="number" id="kmNuevo" placeholder="KM nuevo">

<input type="text" id="vin" placeholder="VIN">

<textarea id="textoWhatsapp" rows="8" placeholder="Pega texto WhatsApp aquí"></textarea>

<button class="import-btn" onclick="importarWhatsapp()">
IMPORTAR WHATSAPP
</button>

<div class="photo-box">

<h2>KM ANTERIOR</h2>

<input type="file" accept="image/*" onchange="cargarFoto(event,'foto1')">

<img id="foto1"
onclick="window.currentPhotoTarget='foto1'">

</div>

<div class="photo-box">

<h2>KM NUEVO</h2>

<input type="file" accept="image/*" onchange="cargarFoto(event,'foto2')">

<img id="foto2"
onclick="window.currentPhotoTarget='foto2'">

</div>

<div class="photo-box">

<h2>VEHÍCULO / TARJETA</h2>

<input type="file" accept="image/*" onchange="cargarFoto(event,'foto3')">

<img id="foto3"
onclick="window.currentPhotoTarget='foto3'">

</div>

<div class="photo-box">

<h2>VIN</h2>

<input type="file" accept="image/*" onchange="cargarFoto(event,'foto4')">

<img id="foto4"
onclick="window.currentPhotoTarget='foto4'">

</div>

<div class="preview" id="previewTexto"></div>

<button class="save-btn" onclick="guardarReporte()">
AGREGAR VEHÍCULO
</button>

<div id="folders"></div>

</div>

<script>

let carpetas = JSON.parse(localStorage.getItem("carpetas")) || {};

function cargarFoto(event,id){

const file = event.target.files[0];

if(!file) return;

const reader = new FileReader();

reader.onload = function(e){

const img = document.getElementById(id);

img.src = e.target.result;

img.style.display = "block";

};

reader.readAsDataURL(file);

}

function importarWhatsapp(){

let texto = document.getElementById("textoWhatsapp").value;

function extraer(label){

let regex = new RegExp("\\*" + label + "\\*:\\s*(.*)");

let match = texto.match(regex);

return match ? match[1].trim() : "";

}

document.getElementById("vehiculo").value = extraer("AUTO");
document.getElementById("placa").value = extraer("PLACA");
document.getElementById("kmAnterior").value = extraer("KM anterior");
document.getElementById("kmNuevo").value = extraer("CORECTO KM");
document.getElementById("vin").value = extraer("VIN");

document.getElementById("previewTexto").innerText = texto;

}

function guardarReporte(){

let vehiculo = document.getElementById("vehiculo").value;

if(!vehiculo){
alert("Agrega vehículo");
return;
}

if(!carpetas[vehiculo]){
carpetas[vehiculo] = [];
}

let reporte = {

vehiculo: vehiculo,
placa: document.getElementById("placa").value,
kmAnterior: document.getElementById("kmAnterior").value,
kmNuevo: document.getElementById("kmNuevo").value,
vin: document.getElementById("vin").value,
fecha: new Date().toLocaleDateString(),

foto1: document.getElementById("foto1").src,
foto2: document.getElementById("foto2").src,
foto3: document.getElementById("foto3").src,
foto4: document.getElementById("foto4").src,

texto: document.getElementById("textoWhatsapp").value

};

carpetas[vehiculo].push(reporte);

localStorage.setItem("carpetas",JSON.stringify(carpetas));

renderFolders();

limpiarCampos();

}

function limpiarCampos(){

document.getElementById("vehiculo").value = "";
document.getElementById("placa").value = "";
document.getElementById("kmAnterior").value = "";
document.getElementById("kmNuevo").value = "";
document.getElementById("vin").value = "";

document.getElementById("textoWhatsapp").value = "";

document.getElementById("previewTexto").innerText = "";

["foto1","foto2","foto3","foto4"].forEach(id=>{

document.getElementById(id).src = "";
document.getElementById(id).style.display = "none";

});

}

function borrarCarpeta(nombre){

if(confirm("¿Borrar carpeta completa?")){

delete carpetas[nombre];

localStorage.setItem("carpetas",JSON.stringify(carpetas));

renderFolders();

}

}

function generarPDF(nombre){

alert("Aquí después conectaremos PDF real para " + nombre);

}

function renderFolders(){

let div = document.getElementById("folders");

div.innerHTML = "";

for(let nombre in carpetas){

div.innerHTML += `

<div class="folder">

<div class="folder-title">
📁 ${nombre}
</div>

<div class="folder-buttons">

<button class="delete-folder"
onclick="borrarCarpeta('${nombre}')">
BORRAR CARPETA
</button>

<button class="pdf-btn"
onclick="generarPDF('${nombre}')">
PDF
</button>

</div>

</div>

`;

}

}

document.addEventListener("paste", async function(e){

const items = (e.clipboardData || e.originalEvent.clipboardData).items;

for (let item of items){

if(item.type.indexOf("image") === 0){

const blob = item.getAsFile();

const reader = new FileReader();

reader.onload = function(event){

const base64 = event.target.result;

if(!window.currentPhotoTarget){

alert("Primero toca la imagen donde quieres pegar la foto");

return;

}

const img = document.getElementById(window.currentPhotoTarget);

img.src = base64;

img.style.display = "block";

};

reader.readAsDataURL(blob);

}

}

});

renderFolders();

</script>

</body>
</html>
